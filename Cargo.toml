[package]
name = "tree-sitter-v"
version = "0.0.5"
description = "V language grammar for tree-sitter — maintained fork"
# Fork contributions are ISC; imported grammar and scanner carry MIT notices
# in LICENSE.upstream and LICENSE.vls, both included in the crate.
license = "ISC AND MIT"
edition = "2021"
repository = "https://github.com/undivisible/tree-sitter-v"
keywords = ["tree-sitter", "vlang", "grammar", "parser", "v"]
categories = ["parsing", "text-editors"]
include = [
  "lib.rs",
  "build.rs",
  "grammar.js",
  "src/**",
  "test/corpus/*",
  "highlights.scm",
  "tree-sitter.json",
  "LICENSE*",
  "CHANGELOG.md",
]

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26"

[build-dependencies]
cc = "1.0"
